# vkBasalt Configuration for Aion
# Vulkan post-processing effects

# Enable by default
ENABLE_VKBASALT=1

# Effects to apply
depth3D=0
CAS=1
FXAA=0
SMAA=0

# CAS (Contrast Adaptive Sharpening) settings
casSharpness=0.4
casDenoise=0

# Effect search paths
effectsSearchPath=/usr/share/vkBasalt

# Log file
logFile=/tmp/aion-vkbasalt.log

# Toggle key (F10)
toggleKey=VK_F10

# Color space
colorSpace=sRGB
