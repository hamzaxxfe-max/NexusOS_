# MangoHud Configuration for Aion
# Performance overlay for gaming

# Layout
position=top-left
round_corners=10.0
font_size=24
background_alpha=0.4
background_color=000000

# CPU
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_color=2E97CB
cpu_value_color=FFFFFF

# GPU
gpu_stats
gpu_temp
gpu_power
gpu_color=2E97D7
gpu_value_color=FFFFFF

# Memory
ram
vram
mem_color=BF616A
mem_value_color=FFFFFF

# FPS
fps
frame_timing
frametime_color=3BDDF0
fps_color=BDFF00
fps_value_color=FFFFFF

# Advanced
frame_count
engine_version
vulkan_driver
wine
gpu_name
display_server
font_file=/usr/share/fonts/noto/NotoSans-Regular.ttf

# Logging
output_folder=/tmp/aion-logs
autostart_log=0
log_duration=0

# FPS limiters
fps_limit=0,60,90,120,144,165,240
toggle_fps_limit=Shift_L+F1
toggle_hud=Shift_L+F2
toggle_logging=Shift_L+F3
reload_config=Shift_L+F4

# Don't show when not gaming
no_display=0
