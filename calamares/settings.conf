# Aion Calamares Installer Configuration
# Graphical installer for Aion

modules-search: [calamares/modules]

# ── Module order ──
sequence:
    - welcome
    - partition
    - users
    - keyboard
    - locale
    - netinstall
    - packagechooser
    - fwupd
    - bootloader
    - initcpio
    - networkcfg
    - hwclock
    - cleanup

# ── Branding ──
branding: aion

# ── Welcome page ──
welcome:
    message: "Welcome to Aion\n\nThe immutable gaming OS built on Arch Linux.\nThis installer will guide you through the setup."
    showBackButton: false

# ── Partition module ──
partition:
    requiredPartitionTableType: gpt
    requiredBootPartitionSize: 512
    requiredRootPartitionSize: 20000
    allowRemoveAllPartitions: true
    allowManualPartitioning: true
    defaultFileSystemType: btrfs

    # Btrfs layout
    btrfsSubvolumes:
        - mountPoint: /
          subvolume: @
          mountOptions: "compress=zstd,noatime"
        - mountPoint: /home
          subvolume: @home
          mountOptions: "compress=zstd,noatime"
        - mountPoint: /var
          subvolume: @var
          mountOptions: "compress=zstd,noatime"
        - mountPoint: /.snapshots
          subvolume: @snapshots
          mountOptions: "compress=zstd,noatime"

# ── Users module ──
users:
    usernameRegex: "^[a-z_][a-z0-9_-]*$"
    hostnameRegex: "^[a-zA-Z0-9][a-zA-Z0-9.-]*$"
    defaultUsername: gamer
    defaultHostname: aion

# ── Keyboard module ──
keyboard:
    showFormats: true
    showVariants: true

# ── Locale module ──
locale:
    supportAllLangs: true

# ── Netinstall (optional online packages) ──
netinstall:
    enabled: false

# ── Package chooser ──
packagechooser:
    choices:
        - id: gaming
          name: "Full Gaming Stack"
          description: "Steam, Proton, Heroic, MangoHud, GameScope, all gaming tools"
          packages:
              - steam
              - steam-native-runtime
              - proton-ge-custom-bin
              - gamescope
              - mangohud
              - gamemode
              - lib32-gamemode
              - vkBasalt
              - lib32-vkBasalt
              - wine
              - lib32-vulkan-icd-loader
              - lib32-mesa
              - flatpak
              - yay

        - id: minimal
          name: "Minimal"
          description: "Base system only, install gaming tools later"
          packages:
              - flatpak

# ── Bootloader ──
bootloader:
    bootloaderPath: /boot
    bootloaderType: systemd-boot

# ── Finish ──
finish:
    message: "Aion has been installed!\n\nReboot to start gaming.\n\nGaming Mode starts automatically."
    reboot: true
